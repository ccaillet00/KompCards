# KompCards — Gesamtsystem (siehe docs/ARCHITECTURE.md)
#
# Traefik ist die einzige öffentlich exponierte Kante.
# Routing (host-basiert, same-origin ⇒ kein CORS):
#   kompcards.ccdevlab.ch          → Public Frontend (Nuxt)
#   service.kompcards.ccdevlab.ch  → SaaS Frontend (Nuxt)
#   service.kompcards.ccdevlab.ch/api → Backend (Express)
# DB ist intern (nur Backend → DB), nicht öffentlich exponiert.
#
# DB-Migrationen werden vor dem Backend-Start explizit ausgeführt; der normale
# Start verändert das Schema nicht (siehe docs/AUTH_MIGRATION.md).
#
# Start:  docker compose up --build
# Hinweis: Frontend-Service ist auskommentiert, bis frontend/ gescaffoldet ist.

name: kompcards

services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: mysql://kompcards:kompcards@db:3306/kompcards_db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://service.kompcards.ccdevlab.ch}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-change-me}
      LLM_MODEL: ${LLM_MODEL:-your-model}
      PORT: "4000"
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`service.kompcards.ccdevlab.ch`) && PathPrefix(`/api`)
      - traefik.http.routers.backend.entrypoints=web-secure
      - traefik.http.routers.backend.tls=true
      - traefik.http.routers.backend.tls.certresolver=cloudflare
      - traefik.http.routers.backend.priority=10
      - traefik.http.services.backend.loadbalancer.server.port=4000

  # Öffentliches Frontend (Landingpage).
  frontend-public:
    build:
      context: ./frontend
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_PUBLIC_APP_MODE: public
      NUXT_PUBLIC_SERVICE_URL: https://service.kompcards.ccdevlab.ch
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend-public.entrypoints=web-secure
      - traefik.http.routers.frontend-public.rule=Host(`kompcards.ccdevlab.ch`)
      - traefik.http.routers.frontend-public.tls=true
      - traefik.http.routers.frontend-public.tls.certresolver=cloudflare
      - traefik.http.routers.frontend-public.priority=1
      - traefik.http.services.frontend-public.loadbalancer.server.port=3000

  # SaaS-Frontend (Login, Dashboard und Kompetenzkarten).
  frontend-service:
    build:
      context: ./frontend
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_PUBLIC_APP_MODE: service
      NUXT_PUBLIC_SERVICE_URL: https://service.kompcards.ccdevlab.ch
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend-service.entrypoints=web-secure
      - traefik.http.routers.frontend-service.rule=Host(`service.kompcards.ccdevlab.ch`)
      - traefik.http.routers.frontend-service.tls=true
      - traefik.http.routers.frontend-service.tls.certresolver=cloudflare
      - traefik.http.routers.frontend-service.priority=1
      - traefik.http.services.frontend-service.loadbalancer.server.port=3000

  db:
    image: mysql:9.7.2
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: kompcards_root
      MYSQL_DATABASE: kompcards_db
      MYSQL_USER: kompcards
      MYSQL_PASSWORD: kompcards
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u kompcards -p$$MYSQL_PASSWORD -e 'SELECT 1' --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
       - "3306:3306" # Nur für lokale Entwicklung; in Produktion entfernen.
    #networks:
     # - proxy
    restart: unless-stopped
    # Kein `ports:` — DB ist intern, nicht öffentlich exponiert.

networks:
  proxy:
    external: true

volumes:
  db-data:
  traefik-letsencrypt:
